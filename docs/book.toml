[book]
title = "RURQE: Rust Universal Relational Query Engine"
authors = ["RURQE"]
description = "RURQE documentation: strictly typed SQL, relational theory in Rust types, migrations and code generation"
language = "en"
src = "."

[build]
# The book renders into the repository-root `target/book` directory, which is
# also the destination the `just doc-build` and `just doc-serve` recipes pass as
# `--dest-dir`, so a plain `mdbook build docs` never writes into the source tree.
build-dir = "../target/book"
create-missing = true

[output.html]
no-section-label = false
