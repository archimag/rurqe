[book]
title = "RURQE: Rust Universal Relational Query Engine"
authors = ["RURQE"]
description = "Документация RURQE: строго типизированный SQL, реляционная теория в типах Rust, миграции и кодогенерация"
language = "ru"
src = "."

[build]
build-dir = "book"
create-missing = true

[output.html]
no-section-label = false

# Snippet editions: every Rust block is compiled by `mdbook test`, which passes
# this edition to rustdoc, so the examples use the 2021 prelude resolution.
[rust]
edition = "2021"
