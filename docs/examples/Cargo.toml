[package]
name = "rurqe-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Compilable documentation examples for RURQE (living documentation)"
# The crate is a documentation surface, never a published artifact.
publish = false

# The workspace denies direct printing because the toolchain writes through a
# single operator channel. An example is read by a human, and printing the
# statement or the row it produced is the point of running it, so this package
# deliberately does not opt into `[lints] workspace = true`.

# The crate compiles three entry-point forms, so the facade is built with the
# drivers they name: the asynchronous form awaits a `deadpool-postgres` pool,
# the `sync_`-prefixed files drive the blocking `rusqlite` and `postgres`
# adapters, and the build-only file (`dialects.rs`) assembles statements under
# pinned SQLite version modules without opening a connection. The facade's
# default features stay enabled — they carry the projection macros and the
# ecosystem column types the examples also compile against — and `postgres`,
# `sqlite`, and `macros` are named here as well, so no target depends on a
# default that may change.
[dependencies]
rurqe = { path = "../../crates/rurqe", version = "0.1.0", features = ["postgres", "sqlite", "macros", "deadpool-postgres"] }
# The pool is configured through the adapter itself and terminates TLS with the
# driver's `NoTls` connector, so both crates are named directly.
deadpool-postgres = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7"

[dev-dependencies]
# The coverage guard reads this manifest into a typed DTO instead of scanning
# it line by line, so a legal TOML spelling of the same targets yields the same
# list and no target can silently drop out of the anchor-coverage check.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# The example files sit at the package root rather than in a nested `examples/`
# subdirectory, so an include path from a chapter never climbs out of the book
# directory. Cargo discovers example targets only under `<package>/examples/`,
# which is why every file below is registered explicitly.
[[example]]
name = "quickstart"
path = "quickstart.rs"

[[example]]
name = "crud"
path = "crud.rs"

[[example]]
name = "joins"
path = "joins.rs"

