[workspace]
members = [
    "crates/rurqe",
    "crates/rurqe-core",
    "crates/rurqe-facade-tests",
    "crates/rurqe-macros",
    "crates/rurqe-migrate",
    "crates/rurqe-postgres",
    "crates/rurqe-sqlite",
    "crates/rurqe-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
repository = "https://github.com/archimag/rurqe"
