[[review.presets]]
name = "workspace"
title = "Workspace and Documentation Audit"
post_analysis = "manual"

[[review.presets.groups]]
name = "core"
paths = ["crates/rurqe-core/src", "crates/rurqe/src", "crates/rurqe-facade-tests"]
prompt = "Audit typed query builder, relational AST, expression engine, facade entry points, and facade integration tests. Verify compile-time SQL correctness, zero-cost monomorphization, panic-free typestates, no unwrap/expect in production code, module size limits (<800 LOC), and adherence to Conventions.md."

[[review.presets.groups]]
name = "dialects"
paths = ["crates/rurqe-postgres/src", "crates/rurqe-sqlite/src"]
prompt = "Audit dialect renderers, capability marker traits, version gates, and execution backends (sync and async). Verify error mapping to ExecutionError, proper transaction rollback handling, and dialect-specific expression extensions."

[[review.presets.groups]]
name = "migrate"
paths = ["crates/rurqe-migrate/src"]
prompt = "Audit migration runner, catalog schema representation, checkpoint verification, and embedded migrations. Verify SHA-256 checksum integrity, transactional execution, and panic-free error propagation."

[[review.presets.groups]]
name = "project"
paths = ["crates/rurqe-project/src"]
prompt = "Audit the rurqe.toml project configuration model shared by the toolchain and the macro crate. Verify strict TOML parsing with positional diagnostics, schema selection, declared path resolution, and typed ConfigError propagation."

[[review.presets.groups]]
name = "cli"
paths = ["crates/rurqe-cli/src"]
prompt = "Audit CLI toolchain commands (migrate, codegen, verify, stage, prune), catalog introspection, and drift detection. Verify unified `cargo rurqe` invocation handling and robust error diagnostics."

[[review.presets.groups]]
name = "macros"
paths = ["crates/rurqe-macros/src"]
prompt = "Audit procedural macros (select!, cols!, dto!, sql!, raw_sql!, sql_type!, embed_migrations!) and their parse utilities. Verify macro hygiene, actionable compile-error diagnostics, and clean break syntax."

[[review.presets.groups]]
name = "docs"
paths = ["docs"]
prompt = "Audit mdBook documentation and living examples together against docs/Conventions.md: plain technical English, standard industry terminology without invented jargon, self-contained chapters without cross-chapter markdown links, five-part canonical structure for SQL statement chapters, and living parity between mdBook text and compiled examples in docs/examples (anchor definitions, async-first tokio entry points, typed error signatures without Box<dyn Error>, and exact pairing between SQL blocks and Rust builders)."
