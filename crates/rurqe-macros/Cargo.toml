[package]
name = "rurqe-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for RURQE query builder"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
rurqe-core = { path = "../rurqe-core" }
# The `embed_migrations!` expansion resolves the migration directory of the
# calling crate through the project configuration, and `rurqe-project` is the
# single owner of that surface: it carries the strict `rurqe.toml` parser and the
# artifact path resolution, so the macro crate reads no configuration of its own
# and the crate's only non-trivial dependency is `toml_edit`. Depending on the
# toolchain crate instead would pull a database driver into the dependency graph
# of every facade user that enables the `macros` feature.
rurqe-project = { path = "../rurqe-project" }

[dev-dependencies]
# The expansions address the core crate through the facade, so the tests of this
# crate compile them exactly like a downstream consumer does: through `rurqe`
# alone. `rurqe-core` stays a dev-dependency because the tests declare their own
# schema markers and parameter values with it, and `migrate` is enabled because
# the `embed_migrations!` expansion constructs the migration collection the
# facade re-exports.
rurqe = { path = "../rurqe", default-features = false, features = ["macros", "migrate", "serde_json"] }
rurqe-core = { path = "../rurqe-core", features = ["serde_json"] }
serde_json = "1"

[lints]
workspace = true
