[package]
name = "rurqe-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for RURQE query builder"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
rurqe-core = { path = "../rurqe-core" }

[dev-dependencies]
# The expansions address the core crate through the facade, so the tests of this
# crate compile them exactly like a downstream consumer does: through `rurqe`
# alone. `rurqe-core` stays a dev-dependency because the tests declare their own
# schema markers and parameter values with it.
rurqe = { path = "../rurqe", default-features = false, features = ["macros", "serde_json"] }
rurqe-core = { path = "../rurqe-core", features = ["serde_json"] }
serde_json = "1"

[lints]
workspace = true
