[package]
name = "rurqe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer toolchain for schema introspection, code generation, migrations, and drift verification"

[[bin]]
name = "rurqe"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
rusqlite = { version = "0.31", features = ["bundled"] }
rurqe-migrate = { path = "../rurqe-migrate", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
syn = { version = "2.0", features = ["full"] }
toml = "0.8"
tracing = "0.1"
url = "2"
