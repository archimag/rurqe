[package]
name = "rurqe-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Developer toolchain for schema introspection, code generation, migrations, and drift verification"

[[bin]]
name = "rurqe"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
rusqlite = { version = "0.31", features = ["bundled"] }
rurqe-core = { path = "../rurqe-core", version = "0.1.0" }
rurqe-migrate = { path = "../rurqe-migrate", version = "0.1.0" }
rurqe-postgres = { path = "../rurqe-postgres", version = "0.1.0", features = ["postgres"] }
rurqe-sqlite = { path = "../rurqe-sqlite", version = "0.1.0", features = ["rusqlite"] }
syn = "2.0"
tracing = "0.1"
