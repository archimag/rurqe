[package]
name = "rurqe-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Flyway-compatible migration model, checksums, and schema history tracking for RURQE"

[dependencies]
# `rurqe_core::calendar` is the single source of the epoch-to-civil conversion,
# and the default feature set of `rurqe-core` brings no external dependency.
rurqe-core = { path = "../rurqe-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", optional = true, default-features = false, features = ["rt"] }
toml = "0.8"
tracing = "0.1"

[features]
default = []
tokio = ["dep:tokio"]
# `strict-async` turns the advisory runtime check into enforcement at the blocking
# lifecycle entry points: a synchronous call that would block a Tokio-managed
# thread is refused instead of merely reported (Conventions.md §3).
strict-async = ["tokio"]
