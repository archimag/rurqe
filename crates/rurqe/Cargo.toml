[package]
name = "rurqe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Ergonomic, strictly type-safe SQL query builder and execution engine for Rust"

[dependencies]
rurqe-core = { path = "../rurqe-core", version = "0.1.0", features = ["tracing"] }
tracing = "0.1"
rurqe-macros = { path = "../rurqe-macros", version = "0.1.0", optional = true }
rurqe-postgres = { path = "../rurqe-postgres", version = "0.1.0", optional = true }
rurqe-migrate = { path = "../rurqe-migrate", version = "0.1.0", optional = true }
rurqe-sqlite = { path = "../rurqe-sqlite", version = "0.1.0", optional = true }

[features]
default = ["postgres", "macros", "migrate", "sqlite", "uuid", "chrono", "serde_json", "decimal"]
macros = ["dep:rurqe-macros"]
# Every PostgreSQL adapter feature enables `rurqe-postgres`, and the crate
# compiles its dialect surface (`rurqe::postgres`, `Postgres`, the version
# markers) as soon as one of them is on. The adapter items themselves stay on
# the feature that owns the driver, so an asynchronous or pooled build never
# pulls in a driver it does not use just to name a dialect.
postgres = ["dep:rurqe-postgres", "rurqe-postgres/postgres"]
tokio-postgres = ["dep:rurqe-postgres", "rurqe-postgres/tokio-postgres", "rurqe-migrate?/tokio"]
sqlite = ["dep:rurqe-sqlite"]
# `migrate` brings the migration crate: the embedded collection, the runner, and
# the backend contracts. The `embed_migrations!` macro additionally needs
# `macros`, because the expansion itself is compiled by the proc-macro crate.
migrate = ["dep:rurqe-migrate"]
tokio = ["rurqe-migrate?/tokio"]
# `r2d2` pools the synchronous drivers, so it enables the `postgres` adapter it
# pools; `deadpool-postgres` pools the asynchronous one.
r2d2 = ["dep:rurqe-postgres", "rurqe-sqlite/r2d2", "rurqe-postgres/r2d2"]
deadpool-postgres = ["dep:rurqe-postgres", "rurqe-postgres/deadpool-postgres"]
uuid = ["rurqe-core/uuid", "rurqe-postgres?/uuid"]
decimal = ["rurqe-core/decimal", "rurqe-postgres?/decimal"]
chrono = ["rurqe-core/chrono", "rurqe-postgres?/chrono"]
serde = ["rurqe-core/serde"]
serde_json = ["rurqe-core/serde_json", "rurqe-postgres?/serde_json"]

[dev-dependencies]
# The facade tests name `serde_json::Value` as a column type, which a feature
# forwarding the family to the drivers cannot provide on its own.
serde_json = "1"

[lints]
workspace = true
