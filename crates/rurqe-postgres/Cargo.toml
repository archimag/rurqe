[package]
name = "rurqe-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PostgreSQL dialect implementation and runtime adapters for RURQE"

[dependencies]
rurqe-core = { path = "../rurqe-core", version = "0.1.0" }
rurqe-migrate = { path = "../rurqe-migrate", version = "0.1.0", optional = true }
tracing = "0.1"
bytes = { version = "1", optional = true }
chrono = { version = "0.4", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
# Consuming the asynchronous driver's row stream needs the `Stream` trait, so
# the dependency is enabled together with the `tokio-postgres` feature.
futures-core = { version = "0.3", optional = true }
postgres = { version = "0.19", optional = true }
r2d2 = { version = "0.8", optional = true }
rust_decimal = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
# The blocking migration adapter drives the asynchronous protocol on a
# current-thread runtime of its own: the runtime schedules the driver work it
# awaits, and a pooled checkout dials its connection on that same runtime, so
# the dependency carries the I/O and timer drivers beside the scheduler.
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "net", "time"] }
tokio-postgres = { version = "0.7", optional = true }
uuid = { version = "1", optional = true }

[features]
# The synchronous driver is built on the asynchronous one, yet it is a separate
# adapter: the shared binding layer needs `bytes`, while the asynchronous adapter
# is compiled only when its own feature asks for it.
postgres = ["dep:postgres", "dep:bytes"]
tokio-postgres = ["dep:tokio-postgres", "dep:bytes", "dep:futures-core", "dep:tokio", "chrono", "serde_json", "uuid"]
# A pool adapter is compiled on top of the driver it pools, so the pool feature
# carries the driver feature instead of leaving the implication implicit:
# `deadpool-postgres` pools the asynchronous client and `r2d2` the synchronous
# one. Each pool submodule of `backend::pools` is gated on that pair, so the
# coupling is declared here and enforced at the module that depends on it.
deadpool-postgres = ["dep:deadpool-postgres", "tokio-postgres"]
r2d2 = ["dep:r2d2", "postgres"]
# The migration protocol of the crate — the history statements, the advisory
# lock, the backend the runner drives, and the catalog introspection behind it —
# executes through the synchronous driver, so the feature carries that driver
# instead of leaving the implication implicit.
migrate = ["dep:rurqe-migrate", "postgres"]
# A value family is forwarded to the drivers that are compiled in, so a driver
# receives the encodings of exactly the families this crate enables.
decimal = ["dep:rust_decimal", "rurqe-core/decimal"]
chrono = [
    "dep:chrono",
    "rurqe-core/chrono",
    "postgres?/with-chrono-0_4",
    "tokio-postgres?/with-chrono-0_4",
]
serde_json = [
    "dep:serde_json",
    "rurqe-core/serde_json",
    "postgres?/with-serde_json-1",
    "tokio-postgres?/with-serde_json-1",
]
uuid = [
    "dep:uuid",
    "rurqe-core/uuid",
    "postgres?/with-uuid-1",
    "tokio-postgres?/with-uuid-1",
]

[dev-dependencies]
# The pooled and asynchronous transaction scenarios check `postgres::Client`
# handles out of an `r2d2` pool and await the asynchronous closures, so the
# suite needs the manager of the synchronous driver and a runtime for the
# asynchronous one. Every scenario is gated on the adapter feature it
# exercises, so a build without those features compiles no test module.
r2d2_postgres = "0.18"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
