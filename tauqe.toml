[providers.openrouter]
models = [
  { model = "~google/gemini-flash-latest", alias = "Gemini Flash" },
  { model = "google/gemini-4-argon", alias = "Gemini Argon" },
  { model = "~openai/gpt-luna-latest", alias = "GPT-5 Luna" },
  { model = "~openai/gpt-sol-latest", alias = "GPT-5 Sol" },
  { model = "~anthropic/claude-opus-latest", alias = "Claude Opus" },
  { model = "~anthropic/claude-sonnet-latest", alias = "Claude Sonnet" },
  { model = "~anthropic/claude-haiku-latest", alias = "Claude Haiku" },
  { model = "~deepseek/deepseek-flash-latest", alias = "DeepSeek Flash" },
  { model = "~z-ai/glm-latest", alias = "GLM"  },
  { model = "~z-ai/glm-flash-latest", alias = "GLM Flash" }
]

[models]
# Semantic model roles: specialized domain roles instead of generic difficulty tiers.
# `primary` is mandatory and must list at least one model; its first entry is the
# active model in the idle state and the deterministic default for the other roles.
primary = [
  { model = "GLM", effort = "max" },
  "Gemini Flash",
]
scribe = "Claude Haiku"    # history compaction, git squash commit messages, diff summarization

# The coder list is the natural escalation ladder (level up): on verification
# healing stalls or exhausted retries the turn advances to the next coder entry.
coder = [
  { model = "DeepSeek Flash", effort = "max" },
  { model = "GLM", effort = "max" },
  { model = "Gemini Flash", level_up = false }
]

# Conceptual design, plan refinement, blocked-step replanning.
architect = [
  "GLM",
  { model = "Gemini Flash", level_up = false },
  { model = "Claude Sonnet", level_up = false }
]

# Automated code review of active context files.
reviewer = [
  "GLM",
  "Gemini Argon",
  "Claude Sonnet",
  "Claude Opus"
]

# Automatically escalate the Coder along its ladder when verification healing stalls.
auto_level_up = true

[project]
runner = "just"


[develop]
max_retries = 5
# max_replans = 2
# workflow = "git"   # edit workflow: "git", "naive" (default: "git")
# protocol = "xml"   # active edit protocol: "xml" (default: "xml")
patch_strategy = "line_anchor"

[git]
# upstream = "origin/master"  # base upstream branch for calculating diffs (auto-detected by default)
# bypass_hooks = true         # pass --no-verify so Tauqe commits skip project pre-commit/commit-msg hooks (default: true)

[history]
budget_tokens = 20000  # session history token budget before compaction is triggered (default: 20000)
# tail_turns = 10        # number of recent turns kept uncompressed in original form (default: 10)

[context]
max_discovery_rounds = 9     # maximum rounds for autonomous context discovery
files_token_budget = 1000000  # token budget for files in active context (default: 300000)
repomap_token_budget = 40000 # token budget for the repository map (default: 4000)
# max_pattern_batch = 150     # maximum files admitted by one glob request (default: 150)
pinned = [
    "Conventions.md",
    "Vision.md",
    "ROADMAP.md",
    "docs/Conventions.md"
]

[[review.presets]]
name = "workspace"
title = "Workspace and Documentation Audit"
post_analysis = "manual"

[[review.presets.groups]]
name = "crates"
paths = ["crates/"]
prompt = "Audit Rust workspace crates against Conventions.md and Vision.md: panic-free invariants (no unwrap/expect in production code), module sizing (<800 LOC, target 150-400), no mod.rs, compile-time SQL correctness, typed errors (ExecutionError without Box<dyn Error>), and zero clippy warnings."

[[review.presets.groups]]
name = "docs"
paths = ["docs/"]
prompt = "Audit mdBook documentation and examples against docs/Conventions.md: plain technical English, standard industry terminology without invented jargon, self-contained chapters without cross-chapter markdown links, five-part canonical structure for SQL statements, code-as-SSOT (all snippets included from docs/examples/ via {{#rustdoc_include}} within ```rust,no_run blocks), no hidden scaffolding lines, and living parity between SQL and Rust builders."

[[review.presets]]
name = "crates"
title = "Workspace Crates Audit"
post_analysis = "manual"

[[review.presets.groups]]
name = "core"
paths = ["crates/rurqe-core/src", "crates/rurqe/src"]
prompt = "Audit typed query builder, relational AST, expression engine, and facade entry points. Verify compile-time SQL correctness, zero-cost monomorphization, panic-free typestates, no unwrap/expect in production code, module size limits (<800 LOC), and adherence to Conventions.md."

[[review.presets.groups]]
name = "dialects"
paths = ["crates/rurqe-postgres/src", "crates/rurqe-sqlite/src"]
prompt = "Audit dialect renderers, capability marker traits, version gates, and execution backends (sync and async). Verify error mapping to ExecutionError, proper transaction rollback handling, and dialect-specific expression extensions."

[[review.presets.groups]]
name = "migrate"
paths = ["crates/rurqe-migrate/src"]
prompt = "Audit migration runner, catalog schema representation, checkpoint verification, and embedded migrations. Verify SHA-256 checksum integrity, transactional execution, and panic-free error propagation."

[[review.presets.groups]]
name = "cli"
paths = ["crates/rurqe-cli/src"]
prompt = "Audit CLI toolchain commands (migrate, codegen, verify, stage, prune), catalog introspection, and drift detection. Verify unified `cargo rurqe` invocation handling and robust error diagnostics."

[[review.presets.groups]]
name = "macros"
paths = ["crates/rurqe-macros/src"]
prompt = "Audit procedural and declarative macros (select!, dto!, table!, sql_type!). Verify hygiene, actionable compile-error diagnostics, and clean break syntax."
[[review.presets]]
name = "library"
title = "Library Crates Audit (Excluding CLI)"
post_analysis = "manual"

[[review.presets.groups]]
name = "core"
paths = ["crates/rurqe-core/src", "crates/rurqe/src"]
prompt = "Audit typed query builder, relational AST, expression engine, and facade entry points. Verify compile-time SQL correctness, zero-cost monomorphization, panic-free typestates, no unwrap/expect in production code, module size limits (<800 LOC), and adherence to Conventions.md."

[[review.presets.groups]]
name = "dialects"
paths = ["crates/rurqe-postgres/src", "crates/rurqe-sqlite/src"]
prompt = "Audit dialect renderers, capability marker traits, version gates, and execution backends (sync and async). Verify error mapping to ExecutionError, proper transaction rollback handling, and dialect-specific expression extensions."

[[review.presets.groups]]
name = "migrate"
paths = ["crates/rurqe-migrate/src"]
prompt = "Audit migration runner, catalog schema representation, checkpoint verification, and embedded migrations. Verify SHA-256 checksum integrity, transactional execution, and panic-free error propagation."

[[review.presets.groups]]
name = "macros"
paths = ["crates/rurqe-macros/src"]
prompt = "Audit procedural and declarative macros (select!, dto!, table!, sql_type!). Verify hygiene, actionable compile-error diagnostics, and clean break syntax."
[[review.presets]]
name = "docs"
title = "Documentation Audit"
post_analysis = "manual"

[[review.presets.groups]]
name = "book"
paths = ["docs/core", "docs/lifecycle", "docs/intro.md", "docs/quickstart.md", "docs/SUMMARY.md"]
prompt = "Audit mdBook chapters against docs/Conventions.md: plain technical English, standard industry terminology without invented jargon, self-contained chapters without cross-chapter markdown links, five-part canonical structure for SQL statement chapters, and no inline API code."

[[review.presets.groups]]
name = "examples"
paths = ["docs/examples"]
prompt = "Audit living documentation examples: verified compilation under `just check`, proper anchor definitions (// ANCHOR / // ANCHOR_END), async-first tokio entry points, typed error signatures (no Box<dyn Error>), and living parity between SQL and Rust builder fragments."